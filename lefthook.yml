pre-commit:
  commands:
    lint:
      run: bun run lint:fix
      stage_fixed: true
    architecture-rails:
      run: bun run check:architecture-rails
    filenames:
      run: bun run check:filenames
    complexity:
      run: bun run check:complexity
    react-rails:
      run: bun run check:react-rails
    typecheck:
      run: bun run typecheck

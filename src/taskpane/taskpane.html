<!DOCTYPE html>
<html lang="es" data-framework="react">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stylistic</title>

    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <div id="container"></div>

    <div id="tridentmessage" style="display: none; padding: 10px;">
        Esta versión de Stylistic requiere un webview moderno de Office. Actualizá Office a una versión compatible.
    </div>

    <script>
        if ((navigator.userAgent.indexOf("Trident") !== -1) || (navigator.userAgent.indexOf("Edge") !== -1)) {
            var tridentMessage = document.getElementById("tridentmessage");
            var normalContainer = document.getElementById("container");
            tridentMessage.style.display = "block";
            normalContainer.style.display = "none";
        }
    </script>
</body>

</html>
